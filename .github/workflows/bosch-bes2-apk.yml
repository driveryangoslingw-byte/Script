name: Bosch BES2 Android APK

on:
  push:
    branches: [bosch-bes2-diagnostics-v3]
  pull_request:
    branches: [bosch-usb-tablet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run protocol tests and assemble APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bosch-USB-Lab-3-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
