name: Bosch USB Android APK
on:
  push:
    branches: [bosch-usb-tablet]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK using preinstalled Android SDK 35
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bosch-USB-Lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload to Catbox
        continue-on-error: true
        run: |
          RESULT=$(curl --fail --silent --show-error --retry 2 --max-time 120 -F "reqtype=fileupload" -F "fileToUpload=@app/build/outputs/apk/debug/app-debug.apk" https://catbox.moe/user/api.php || true)
          case "$RESULT" in
            https://files.catbox.moe/*)
              echo "APK URL: $RESULT"
              echo "## APK" >> "$GITHUB_STEP_SUMMARY"
              echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Catbox upload unavailable: $RESULT" ;;
          esac
