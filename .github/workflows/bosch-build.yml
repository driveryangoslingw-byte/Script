name: Bosch BES2 Android APK
on:
  push:
    branches: [bosch-usb-tablet]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Protocol self-tests
        run: |
          mkdir -p /tmp/bosch-tests
          javac -d /tmp/bosch-tests app/src/main/java/online/wixed/boschusb/Protocol.java tests/ProtocolSelfTest.java
          java -cp /tmp/bosch-tests online.wixed.boschusb.ProtocolSelfTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bosch-BES2-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
